name: Watchability NFL

# Il play-by-play di nflverse si aggiorna di notte durante la stagione: tre passaggi coprono
# giovedi', domenica e lunedi' sera americani. Si puo' lanciare anche a mano da Actions.
on:
  schedule:
    - cron: '30 9 * * 2,5,6'
    - cron: '30 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow
      - run: python watchability_nfl.py
      - name: Pubblica il CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add watchability_nfl.csv
          git diff --cached --quiet || git commit -m "Watchability NFL aggiornata"
          git pull --rebase
          git push

name: Watchability NFL

# Ogni ora: il dramma deve arrivare nel foglio appena nflverse pubblica il play-by-play (di solito nella
# notte europea dopo la partita). Se il CSV non cambia non si committa niente. Il foglio usa il Gambletron
# solo per le partite finite che qui non ci sono ancora, e lo sostituisce appena compaiono.
# Si puo' lanciare anche a mano da Actions.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: watchability-nfl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow
      - run: python watchability_nfl.py
      - name: Pubblica il CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add watchability_nfl.csv
          git diff --cached --quiet || git commit -m "Watchability NFL aggiornata"
          git pull --rebase
          git push
